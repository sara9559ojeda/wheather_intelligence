# =====================================================================
# Weather Intelligence — orquestación de servicios
#
#   db        PostgreSQL 16
#   backend   API FastAPI + scheduler de ingesta (aplica migraciones al arrancar)
#   frontend  dashboard React (Nginx) — sirve la SPA y hace de proxy a /api
#             (repo aparte: clónalo en ./frontend antes de levantar, ver README)
#
#   docker compose up -d   ->   http://localhost:5173
# =====================================================================
name: weather-intelligence

services:
  db:
    image: postgres:16-alpine
    container_name: wi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wi_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # dentro de la red de compose el host de la BD es "db"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: wi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  wi_pgdata:
